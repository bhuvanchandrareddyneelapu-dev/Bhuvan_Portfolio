<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <rect width="600" height="400" fill="#0b0f15"/>
  
  <defs>
    <pattern id="certGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141c28" stroke-width="0.7"/>
    </pattern>
  </defs>
  
  <rect width="600" height="400" fill="url(#certGrid)"/>
  
  <!-- Certificate Border -->
  <rect x="25" y="25" width="550" height="350" rx="8" stroke="#1e2d42" stroke-width="2"/>
  <rect x="35" y="35" width="530" height="330" rx="6" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Corner embellishments -->
  <polygon points="25,25 45,25 25,45" fill="#10b981" fill-opacity="0.4"/>
  <polygon points="575,25 555,25 575,45" fill="#10b981" fill-opacity="0.4"/>
  <polygon points="25,375 45,375 25,355" fill="#10b981" fill-opacity="0.4"/>
  <polygon points="575,375 555,375 575,355" fill="#10b981" fill-opacity="0.4"/>

  <!-- Seal / Badge -->
  <circle cx="300" cy="115" r="42" fill="#111827" stroke="#10b981" stroke-width="2"/>
  <polygon points="300,85 312,110 324,135 300,125 276,135 288,110" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <circle cx="300" cy="115" r="8" fill="#10b981"/>

  <!-- Header -->
  <text x="300" y="190" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="3">DIGITAL CREDENTIAL CERTIFICATE</text>
  <text x="300" y="225" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold">[CERTIFICATION CREDENTIAL PREVIEW]</text>
  <text x="300" y="255" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Issued by [ISSUING ORGANIZATION] — Verified Credential</text>

  <!-- Cryptographic / Verification Hash Bar -->
  <rect x="80" y="290" width="440" height="34" rx="4" fill="#0f1622" stroke="#1e293b" stroke-width="1"/>
  <text x="300" y="312" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10" letter-spacing="1">ID: CERT-VERIFIED-HASH-TOKEN // AUTH: VALID</text>

  <text x="300" y="350" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Place your certificate images in /public/certificates/ or link verification URL</text>
</svg>
